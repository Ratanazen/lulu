<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="luluGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="50%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </radialGradient>
    <radialGradient id="earInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Aura -->
  <circle cx="64" cy="64" r="58" fill="#4F46E5" opacity="0.15" filter="url(#softGlow)"/>

  <!-- Left Ear -->
  <path d="M 32 46 C 18 18 36 6 48 24 Z" fill="#818CF8" stroke="#4338CA" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 34 42 C 26 24 38 16 44 28 Z" fill="url(#earInner)"/>

  <!-- Right Ear -->
  <path d="M 96 46 C 110 18 92 6 80 24 Z" fill="#818CF8" stroke="#4338CA" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 94 42 C 102 24 90 16 84 28 Z" fill="url(#earInner)"/>

  <!-- Body / Head -->
  <ellipse cx="64" cy="68" rx="46" ry="42" fill="url(#luluGlow)" stroke="#4338CA" stroke-width="3.5"/>

  <!-- Cheeks (Blush) -->
  <ellipse cx="38" cy="74" rx="8" ry="4" fill="#F472B6" opacity="0.6"/>
  <ellipse cx="90" cy="74" rx="8" ry="4" fill="#F472B6" opacity="0.6"/>

  <!-- Big Curious Eyes -->
  <ellipse cx="48" cy="62" rx="7" ry="10" fill="#1E1B4B"/>
  <circle cx="46" cy="58" r="3.5" fill="#FFFFFF"/>
  <circle cx="50" cy="66" r="1.5" fill="#C7D2FE"/>

  <ellipse cx="80" cy="62" rx="7" ry="10" fill="#1E1B4B"/>
  <circle cx="78" cy="58" r="3.5" fill="#FFFFFF"/>
  <circle cx="82" cy="66" r="1.5" fill="#C7D2FE"/>

  <!-- Little Smile -->
  <path d="M 58 72 Q 64 77 70 72" fill="none" stroke="#312E81" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Star Sparkle on Forehead -->
  <path d="M 64 36 L 66 43 L 73 45 L 66 47 L 64 54 L 62 47 L 55 45 L 62 43 Z" fill="#FBBF24"/>
  <circle cx="64" cy="45" r="2" fill="#FFFBEB"/>

  <!-- Little paws -->
  <ellipse cx="48" cy="104" rx="10" ry="6" fill="#A5B4FC" stroke="#4338CA" stroke-width="2.5"/>
  <ellipse cx="80" cy="104" rx="10" ry="6" fill="#A5B4FC" stroke="#4338CA" stroke-width="2.5"/>
</svg>
